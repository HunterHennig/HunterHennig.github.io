<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Tracker</title>
    <link rel="icon" href="https://open.spotify.com/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <!-- background animation -->
    <div class="container">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

    <div class="content">
        <h1 class="loading-dots">Loading Spotify Data</h1>
        <div id="status"></div>
        <div class="glass">
            <img id="albumcover" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" alt="Album Cover" style="display:none; width:300px; height:300px;">
            <div id="songname"></div>
            <div id="artistname"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION — set your Spotify app's client ID here
        // ============================================================
        const CLIENT_ID = '88ea3353994145f1a8d4e498e70ebeb9';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const SCOPES = 'user-read-private user-read-email user-read-playback-state';

        // ============================================================
        // PKCE HELPER FUNCTIONS
        // ============================================================

        // Generate a random code verifier string
        function generateCodeVerifier(length = 128) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
            let result = '';
            const randomValues = crypto.getRandomValues(new Uint8Array(length));
            randomValues.forEach(v => result += chars[v % chars.length]);
            return result;
        }

        // Hash the code verifier into a code challenge using SHA-256
        async function generateCodeChallenge(verifier) {
            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode(...new Uint8Array(digest)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        // ============================================================
        // AUTH FUNCTIONS
        // ============================================================

        // Redirect the user to Spotify's login page
        async function redirectToSpotifyLogin() {
            const codeVerifier = generateCodeVerifier();
            const codeChallenge = await generateCodeChallenge(codeVerifier);

            // Store verifier in sessionStorage so we can use it after redirect
            sessionStorage.setItem('code_verifier', codeVerifier);

            const params = new URLSearchParams({
                response_type: 'code',
                client_id: CLIENT_ID,
                scope: SCOPES,
                redirect_uri: REDIRECT_URI,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge
            });

            window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
        }

        // Exchange the authorization code for access and refresh tokens
        async function exchangeCodeForTokens(code) {
            const codeVerifier = sessionStorage.getItem('code_verifier');

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: REDIRECT_URI,
                    client_id: CLIENT_ID,
                    code_verifier: codeVerifier
                })
            });

            const data = await response.json();

            if (data.access_token) {
                // Store tokens and expiry time in sessionStorage
                sessionStorage.setItem('access_token', data.access_token);
                sessionStorage.setItem('refresh_token', data.refresh_token);
                sessionStorage.setItem('token_expiry', Date.now() + data.expires_in * 1000);

                // Clean the authorization code from the URL
                window.history.replaceState({}, document.title, window.location.pathname);
            } else {
                console.error('Failed to exchange code for tokens:', data);
            }
        }

        // Refresh the access token using the refresh token
        async function refreshAccessToken() {
            const refresh_token = sessionStorage.getItem('refresh_token');
            if (!refresh_token) return;

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    grant_type: 'refresh_token',
                    refresh_token: refresh_token,
                    client_id: CLIENT_ID
                })
            });

            const data = await response.json();

            if (data.access_token) {
                sessionStorage.setItem('access_token', data.access_token);
                sessionStorage.setItem('token_expiry', Date.now() + data.expires_in * 1000);
                if (data.refresh_token) {
                    sessionStorage.setItem('refresh_token', data.refresh_token);
                }
                console.log('Access token refreshed');
            }
        }

        // Check if token is expired and refresh if needed
        async function ensureValidToken() {
            const expiry = sessionStorage.getItem('token_expiry');
            if (expiry && Date.now() > expiry - 60000) {
                await refreshAccessToken();
            }
        }

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        function updateHeader(data) {
            const h1 = document.querySelector('h1');
            const name = data.display_name || data.id;
            if (name) {
                h1.classList.remove('loading-dots');
                h1.innerText = `${name} is listening to`;
            }
        }

        // ============================================================
        // COLOR SAMPLING
        // ============================================================

        async function pickColorsFromAlbumArt(imageUrl) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = imageUrl;

            await new Promise(resolve => img.onload = resolve);

            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);

            const pixels = [];
            for (let x = 0.1; x <= 0.9; x += 0.1) {
                for (let y = 0.1; y <= 0.9; y += 0.1) {
                    const px = ctx.getImageData(
                        Math.floor(x * canvas.width),
                        Math.floor(y * canvas.height),
                        1, 1
                    ).data;
                    const r = px[0], g = px[1], b = px[2];
                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);
                    const saturation = max - min;
                    const brightness = (r + g + b) / 3;
                    if (brightness < 40 || brightness > 220) continue;
                    const richness = saturation * (1 - Math.abs(brightness - 128) / 128);
                    pixels.push({ r, g, b, richness });
                }
            }

            pixels.sort((a, b) => b.richness - a.richness);

            const sampledColors = [];
            for (const pixel of pixels) {
                const color = [pixel.r, pixel.g, pixel.b];
                const tooSimilar = sampledColors.some(existing =>
                    Math.abs(existing[0] - color[0]) < 50 &&
                    Math.abs(existing[1] - color[1]) < 50 &&
                    Math.abs(existing[2] - color[2]) < 50
                );
                if (!tooSimilar) sampledColors.push(color);
                if (sampledColors.length === 7) break;
            }

            const darkenFactor = 0.4;
            const colors = sampledColors.map(([r, g, b]) =>
                `rgb(${Math.floor(r * darkenFactor)}, ${Math.floor(g * darkenFactor)}, ${Math.floor(b * darkenFactor)})`
            );

            const divs = document.querySelectorAll('.container div');
            colors.forEach((color, i) => {
                if (divs[i]) divs[i].style.backgroundColor = color;
            });
        }

        // ============================================================
        // SPOTIFY API CALLS
        // ============================================================

        async function fetchUserProfile() {
            const access_token = sessionStorage.getItem('access_token');
            const response = await fetch('https://api.spotify.com/v1/me', {
                headers: { 'Authorization': 'Bearer ' + access_token }
            });
            if (response.status === 401) {
                await refreshAccessToken();
                return fetchUserProfile();
            }
            const data = await response.json();
            return data;
        }

        async function fetchNowPlaying() {
            await ensureValidToken();
            const access_token = sessionStorage.getItem('access_token');

            const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                headers: { 'Authorization': 'Bearer ' + access_token }
            });

            if (response.status === 401) {
                await refreshAccessToken();
                return;
            }

            if (response.status === 204) {
                document.getElementById('albumcover').style.display = 'none';
                document.getElementById('albumcover').src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==";
                document.getElementById('songname').innerText = '';
                document.getElementById('artistname').innerText = '';
                document.querySelector('.glass').style.display = 'none';

                const h1 = document.querySelector('h1');
                h1.classList.add('loading-dots');
                h1.innerText = 'Waiting for music';

                const divs = document.querySelectorAll('.container div');
                divs.forEach(div => div.style.backgroundColor = '');
                return;
            }

            const data = await response.json();
            if (data && data.item) {
                const song = data.item.name;
                const artist = data.item.artists.map(a => a.name).join(', ');
                const albumArt = data.item.album.images[0].url;

                await sleep(1750);

                document.getElementById('songname').innerText = song;
                document.getElementById('artistname').innerText = artist;

                const img = document.getElementById('albumcover');
                img.src = albumArt;
                img.style.display = 'block';
                document.querySelector('.glass').style.display = 'block';

                pickColorsFromAlbumArt(albumArt);

                if (userProfileData) updateHeader(userProfileData);
            }
        }

        // ============================================================
        // MAIN — handle auth flow and start polling
        // ============================================================

        let userProfileData = null;

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const accessToken = sessionStorage.getItem('access_token');

            if (code) {
                // We just came back from Spotify login — exchange code for tokens
                await exchangeCodeForTokens(code);
                userProfileData = await fetchUserProfile();
                fetchNowPlaying();
                setInterval(fetchNowPlaying, 5000);
            } else if (accessToken) {
                // Already have a token — just start polling
                await ensureValidToken();
                userProfileData = await fetchUserProfile();
                fetchNowPlaying();
                setInterval(fetchNowPlaying, 5000);
            } else {
                // No token and no code — redirect to Spotify login
                redirectToSpotifyLogin();
            }
        }

        init();
    </script>
</body>
</html>
